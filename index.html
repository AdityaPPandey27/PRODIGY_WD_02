<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Stopwatch</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="card-container">
        <!-- Status Header -->
        <header class="status-header">
            <div class="status-indicator">
                <span id="status-dot" class="dot stopped" aria-hidden="true"></span>
                <span id="status-text" aria-live="polite">Stopped</span>
            </div>
            <div class="keyboard-hints" aria-hidden="true">
                <span>[Space] Play/Pause</span> • <span>[L] Lap</span> • <span>[R] Reset</span>
            </div>
        </header>

        <!-- Timer Display -->
        <section class="timer-section">
            <h1 id="timer-display" class="timer-display" aria-label="Stopwatch time">
                <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span><span class="colon">:</span><span id="milliseconds" class="ms">000</span>
            </h1>
        </section>

        <!-- Controls -->
        <section class="controls" aria-label="Stopwatch controls">
            <button id="btn-start" class="btn btn-primary" aria-label="Start stopwatch">Start</button>
            <button id="btn-pause" class="btn btn-warning hidden" aria-label="Pause stopwatch">Pause</button>
            <button id="btn-resume" class="btn btn-success hidden" aria-label="Resume stopwatch">Resume</button>
            <button id="btn-lap" class="btn btn-secondary hidden" aria-label="Record lap" disabled>Lap</button>
            <button id="btn-reset" class="btn btn-danger hidden" aria-label="Reset stopwatch">Reset</button>
        </section>

        <!-- Laps Section -->
        <section class="laps-section">
            <header class="laps-header">
                <h2>Laps</h2>
                <span id="lap-count" class="badge">0 Total</span>
            </header>
            
            <div class="laps-container" id="laps-list" aria-live="polite">
                <!-- Lap items will be injected here via JS -->
                <div class="empty-state">No laps recorded yet</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
